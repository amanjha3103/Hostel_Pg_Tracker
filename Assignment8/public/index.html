<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel/PG Room Catalogue</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <h1>Hostel/PG Room Catalogue</h1>
    <p>Check available rooms and add a new room.</p>

    <section>
      <h2>Available Rooms</h2>
      <div id="room-list"></div>
    </section>

    <section>
      <h2>Add a Room</h2>

      <form id="room-form">
        <label>
          Room name
          <input type="text" name="name" placeholder="Room E-401" required />
        </label>

        <label>
          Room number
          <input type="text" name="roomNumber" placeholder="E-401" required />
        </label>

        <label>
          Sharing type
          <select name="sharing" required>
            <option value="">Select type</option>
            <option>Single Room</option>
            <option>Double Sharing</option>
            <option>Triple Sharing</option>
          </select>
        </label>

        <label>
          Monthly rent
          <input type="number" name="rent" placeholder="9200" required />
        </label>

        <label class="check">
          <input type="checkbox" name="available" checked />
          Available now
        </label>

        <button type="submit">Add Room</button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script>
    const roomList = document.getElementById("room-list");
    const form = document.getElementById("room-form");
    const message = document.getElementById("message");

    async function loadRooms() {
      const response = await fetch("/items");
      const rooms = await response.json();

      roomList.innerHTML = rooms.map((room) => `
        <div class="room-card">
          <h3>${room.name}</h3>
          <p>Room number: ${room.roomNumber}</p>
          <p>Type: ${room.sharing}</p>
          <p>Rent: ₹${room.rent}/month</p>
          <p>${room.available ? "Available" : "Occupied"}</p>
        </div>
      `).join("");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = new FormData(form);

      const newRoom = {
        name: data.get("name"),
        roomNumber: data.get("roomNumber"),
        sharing: data.get("sharing"),
        rent: Number(data.get("rent")),
        available: data.get("available") === "on"
      };

      const response = await fetch("/items", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(newRoom)
      });

      const result = await response.json();

      if (response.ok) {
        message.textContent = result.name + " added successfully.";
        form.reset();
        form.elements.available.checked = true;
        loadRooms();
      } else {
        message.textContent = result.error;
      }
    });

    loadRooms();
  </script>
</body>
</html>
